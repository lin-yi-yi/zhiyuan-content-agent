name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: ./scripts/setup.sh
      - name: Run backend and frontend checks
        run: ./scripts/check.sh
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org
      - name: Install Chromium for browser regression
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser workflow
        working-directory: frontend
        run: npm run test:e2e
      - name: Save synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-regression
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7
  container-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Verify container upgrade and snapshot rollback
        run: >-
          python scripts/container_smoke.py
          --baseline-ref 9364eb0f908b79e68abe1fd30e23d66337b6df6f
          --output .data/validation/container-smoke/report.json
      - name: Save synthetic container evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: container-recovery
          path: .data/validation/container-smoke/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
